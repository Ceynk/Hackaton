databases:
  - name: mente-sana-db
    databaseName: mente_sana_joven
    user: mente_sana_user
    plan: free

services:
  - type: web
    name: mente-sana-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mente-sana-db
          property: connectionString
      - key: ORIGEN_PERMITIDO_CORS
        value: "*"
      - key: MODO_BASE_DATOS
        value: postgres

  - type: web
    name: mente-sana-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mente-sana-backend
          envVarKey: RENDER_EXTERNAL_URL
